# Host Nginx vhost, based on the read-only inspection on 2026-11-18.
# API/auth/grafana vhosts and the existing certificate stay separate.
server {
    listen 80;
    server_name sportguide.online www.sportguide.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sportguide.online www.sportguide.online;

    ssl_certificate     /etc/nginx/ssl/sportguide.crt;
    ssl_certificate_key /etc/nginx/ssl/sportguide.key;

    root /var/www/sportguide;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;

    location = /landing {
        absolute_redirect off;
        return 308 /landing/$is_args$args;
    }

    # MIME types come from /etc/nginx/mime.types, including .js modules.
    # Landing filenames are not hashed: do not cache them as immutable.
    location ^~ /landing/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
