telegram:
  bot:
    token: ${BOT_TOKEN}
    username: ${BOT_NAME}
  mainAdminId: ${MAIN_ADMIN_ID}
  secondAdminId: ${SECOND_ADMIN_ID}

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000

logging:
  level:
    org.springframework.orm.jpa: WARN
    org.springframework.security: WARN
    org.springframework.security.oauth2: WARN
    org.springframework.boot.autoconfigure.security: WARN
    org.springframework.web.client.RestTemplate: WARN

server:
  port: 8081

spring:
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.2
  cloud:
    openfeign:
      oauth2:
        enabled: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_SECRET}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: https://auth.sportguide.online/realms/sportguide
            authorization-uri: https://auth.sportguide.online/realms/sportguide/protocol/openid-connect/auth
            token-uri: https://auth.sportguide.online/realms/sportguide/protocol/openid-connect/token
            user-info-uri: https://auth.sportguide.online/realms/sportguide/protocol/openid-connect/userinfo
            jwk-set-uri: https://auth.sportguide.online/realms/sportguide/protocol/openid-connect/certs
            user-name-attribute: preferred_username
      resource-server:
        jwt:
          issuer-uri: https://auth.sportguide.online/realms/sportguide
  data:
    redis:
      host: redis
      port: 6379
  datasource:
    url: jdbc:postgresql://postgres:5432/postgres?currentSchema=app_schema&reWriteBatchedInserts=true&stringtype=unspecified
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 60000
      max-lifetime: 600000
#      connection-init-sql: CREATE SCHEMA IF NOT EXISTS app_schema
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    properties:
      format_sql: true
      hibernate:
        default_schema: app_schema
        hbm2ddl:
          create_namespaces: true
        jdbc:
          lob:
            non_contextual_creation: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration
  sql:
    init:
      mode: never
      schema-locations: classpath:init.sql
  h2:
    console:
      enabled: false
  main:
    web-application-type: servlet

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus,metrics,loggers,metricsofusers
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
    enable:
      jvm: true
      tomcat: true
      logback: true
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    db:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

app:
  redis:
    enable: true
    data-loader:
      enabled: true

