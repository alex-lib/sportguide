name: Deploy to Server

on:
  push:
    branches:
      - master

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -eu
            cd /root/sport_point_telegram_bot
            git pull --ff-only origin master
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            ./gradlew clean build

            # Build both parts before replacing the running application.
            (
              cd frontend
              npm ci
              npm run build
              test -s dist/index.html
            )
            docker-compose build app
            docker-compose up -d --no-deps app

            # A protected API must respond with 401, not a connection error or 502.
            status=000
            for attempt in $(seq 1 30); do
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 2 --max-time 5 http://127.0.0.1:8081/api/events) || status=000
              if [ "$status" = 401 ]; then
                break
              fi
              sleep 5
            done
            if [ "$status" != 401 ]; then
              echo "Application did not become ready (HTTP $status)" >&2
              docker-compose ps app
              exit 1
            fi

            # Keep previous assets available for clients with an older index.html.
            cp -r frontend/dist/. /var/www/sportguide/
