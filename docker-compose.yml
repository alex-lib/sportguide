version: '3.8'
services:

  postgres:
    image: postgres:14
    container_name: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0.12
    container_name: redis
    command: [ "redis-server", "--appendonly", "yes", "--replicaof", "no", "one" ]
    ports:
      - "6379:6379"

  liquibase:
    container_name: liquibase
    image: liquibase/liquibase:latest
    volumes:
      - ./liquibase:/liquibase/changelog
    depends_on:
      - postgres
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Waiting 120 seconds for Postgres..."
        sleep 120
        liquibase --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB} --username=${POSTGRES_USER} --password=${POSTGRES_PASSWORD} --changeLogFile=/liquibase/changelog/db.changelog-master.xml --defaultSchemaName=app_schema generateChangeLog

  app:
    build: .
    container_name: app
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=app_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379