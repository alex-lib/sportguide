global:
  scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'prometheus:9090' ]

  - job_name: 'sportguide-app'
    static_configs:
      - targets: [ 'app:8081' ]
    metrics_path: '/actuator/prometheus'